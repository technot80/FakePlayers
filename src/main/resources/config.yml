# FakePlayersFolia Configuration
# Simulates player activity with fake players for Folia servers

# Config version - DO NOT EDIT
config-version: 2

# Server connection (for reference, not used for NMS approach)
server:
  host: "localhost"
  port: 25565

# Activity settings
activity:
  # Run fake player activity even when no real players are online
  always-active: false
  # Minimum real players required before fake players become active (ignored if always-active is true)
  min-real-players: 1
  # Maximum fake players allowed online at once
  max-fake-players: 20

# Join behavior
join:
  # Seconds between potential joins
  delay-min: 30
  delay-max: 120
  # Chance for a join to occur each cycle (0-100)
  chance: 100

# Quit behavior
quit:
  enabled: true
  # Seconds before auto-quit
  delay-min: 300
  delay-max: 900

# Welcome message behavior
welcome:
  enabled: true
  # Percent chance a fake player will welcome (0-100)
  chance: 50
  # Seconds after real player joins before welcome
  delay-min: 2
  delay-max: 8
  # Max fake players that can welcome at once
  max-concurrent: 3
  # Cooldown before same player can be welcomed again (seconds)
  cooldown: 60

  # Messages for first-time players
  first-join-messages:
    - "Hey {player}! Welcome to the server!"
    - "Welcome {player}! Nice to see a new face!"
    - "Hi {player}, welcome aboard!"
    - "Welcome {player}, enjoy your stay!"
    - "Hey {player}! Glad you joined!"

  # Messages for returning players
  rejoin-messages:
    - "Welcome back {player}!"
    - "Hey {player}, good to see you again!"
    - "{player} is back!"
    - "wb {player}"
    - "Hey {player}! Long time no see!"

# Bot settings
bot:
  # Make bots invisible in-game
  invisible: true
  invulnerable: true
  no-gravity: true
  no-collision: true
  # Hide from other players' view (tab only)
  hide-from-players: true

# AI Chat settings
# Requires AgentChatAPI plugin: https://github.com/technot80/AgentChatAPI
ai:
  # Enable AI chat features (requires AgentChatAPI to be installed and enabled)
  enabled: false
  # Number of fake players that can use AI chat (0 to disable)
  enabled-ai-count: 5
  # Chance for an online fake player to be selected for AI (0-100)
  selection-chance: 50
  # Minimum real players online before AI fake players start chatting
  min-real-players: 1
  # Delay in ticks between AI chat messages (20 ticks = 1 second)
  chat-delay-min: 100
  chat-delay-max: 300
  # Chance an AI fake player will respond to real player chat (0-100)
  response-chance: 30
  # Chance AI fake players will chat amongst themselves (0-100)
  self-chat-chance: 20

# Debug mode (extra logging)
debug: false
